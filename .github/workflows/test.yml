name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # test/issue-166-commit-body.test.js reads the commit history
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run contract and packaging tests
        run: npm test

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        subagents-version: ['0.70.0', '0.78.0', '0.90.0']
    env:
      TIDD_EXPECT_PI_VERSION: '1.6.1'
      TIDD_EXPECT_SUBAGENTS_VERSION: ${{ matrix.subagents-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned Pi host
        run: npm install --global --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$TIDD_EXPECT_PI_VERSION"
      - name: Install pinned subagent runtime without host peers
        run: npm install --prefix "$HOME/.pi/agent/npm" --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund "pi-subagents@$TIDD_EXPECT_SUBAGENTS_VERSION"
      - name: Verify installed versions and runtime compatibility
        run: npm run test:compat

  helper-node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run packaged helper tests
        run: node --test test/issue-47-helpers.test.js test/issue-35-failure-injection.test.js test/issue-52-helper-hardening.test.js test/issue-69-worktree-recovery.test.js test/issue-36-evidence-envelope.test.js test/issue-74-composition-shapes.test.js test/issue-40-source-reply-markers.test.js test/issue-78-embedded-repo-inventory.test.js

  publication-git-bash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Locate Git Bash
        shell: pwsh
        run: |
          $bash = (Get-Command bash.exe).Source
          "PI_GIT_BASH=$bash" >> $env:GITHUB_ENV
      - name: Run publication tests under Git Bash
        shell: bash
        run: node --test test/pr-review-publication.test.js
