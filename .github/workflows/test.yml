name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run contract and packaging tests
        run: npm test

  helper-node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run packaged helper tests
        run: node --test test/issue-47-helpers.test.js test/issue-35-failure-injection.test.js test/issue-52-helper-hardening.test.js test/issue-69-worktree-recovery.test.js test/issue-50-aggregate-accounting.test.js

  publication-git-bash:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate Git Bash
        shell: pwsh
        run: |
          $bash = (Get-Command bash.exe).Source
          "PI_GIT_BASH=$bash" >> $env:GITHUB_ENV
      - name: Run publication tests under Git Bash
        shell: bash
        run: node --test test/pr-review-publication.test.js
